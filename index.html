<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Instagram UI Practice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="logo-container">
      <img src="./drive.webp" alt="" />
      <p>Google Drive</p>
    </div>
    <div class="logo-container">
      <img class="second" src="./drive.webp" alt="" />
      <p class="drive">Drive</p>
    </div>
    <div class="h">Store and share files online</div>
    <div class="main-content">
      <p class="sign-in-para">Sign in to get started</p>
      <form action="./login.html" method="POST">
        <input type="email" placeholder="Email" name="username" required />

        <input
          type="password"
          placeholder="Password"
          name="password"
          required
        />
        <p class="forgot">Forgot password?</p>
        <p class="not">
          Not your computer? Use Guest mode to sign in privately
        </p>
        <p class="learn">Learn more</p>
        <button>Sign In</button>
      </form>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
